name: FWS public report export probe
on:
  push:
    branches: [audit/fws-beetool-county-export-20261119]
    paths:
      - 'tests/fws-powerbi-probe.cjs'
      - '.github/workflows/fws-powerbi-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Open public FWS Power BI report in browser
        run: node tests/fws-powerbi-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-report-probe
          path: fws-beetool-probe.png
